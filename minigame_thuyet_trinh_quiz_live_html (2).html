<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🚀 Space Quiz Race</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      margin: 0;
      overflow-x: hidden;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #0f172a, #020617);
      color: white;
    }

    .glass {
      background: rgba(15,23,42,0.45);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,0.1);
      transition: all 0.8s ease;
    }

    .ship {
      position: absolute;
      transition: all 1s ease;
      font-size: 42px;
    }

    .planet {
      animation: float 3s infinite ease-in-out;
    }

    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }
  </style>
</head>
<body>

<div class="min-h-screen flex flex-col items-center justify-center p-4">

  <!-- START -->
  <div id="startScreen" class="glass rounded-3xl p-8 w-full max-w-2xl shadow-2xl text-center">
    <h1 class="text-5xl font-bold mb-4">🚀 Space Quiz Race</h1>

    <p class="text-gray-300 mb-6 text-lg">
      Trả lời đúng để tăng tốc tàu vũ trụ và giành chiến thắng tới Trái Đất 🌍
    </p>

    <div class="space-y-4">
      <input id="playerName" type="text"
        placeholder="Nhập tên người chơi..."
        class="w-full p-4 rounded-2xl text-black text-lg" />

      <button onclick="startGame()"
        class="bg-blue-500 hover:bg-blue-600 transition px-6 py-4 rounded-2xl font-bold text-xl w-full">
        Bắt Đầu Cuộc Đua
      </button>
    </div>
  </div>

  <!-- GAME -->
  <audio id="correctSound" src="https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3"></audio>
  <audio id="wrongSound" src="https://assets.mixkit.co/active_storage/sfx/2955/2955-preview.mp3"></audio>
  <audio id="moveSound" src="https://assets.mixkit.co/active_storage/sfx/212/212-preview.mp3"></audio>

  <div id="gameScreen" class="hidden w-full max-w-5xl relative">

    <div id="questionPanel" class="glass rounded-3xl p-6 mb-6 shadow-2xl relative z-10">
      <div class="flex justify-between items-center mb-4">
        <div>
          <h2 id="questionNumber" class="text-2xl font-bold"></h2>
          <p id="scoreText" class="text-yellow-300 text-lg"></p>
        </div>

        <div class="text-right">
          <div id="timer" class="text-5xl font-bold text-red-400">15</div>
          <div class="text-gray-300">giây</div>
        </div>
      </div>

      <h3 id="questionText" class="text-3xl font-bold mb-6"></h3>

      <div id="answers" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </div>

    <!-- SPACE RACE BACKGROUND -->
    <div id="raceScene" class="rounded-3xl p-6 relative overflow-hidden h-[420px] -mt-[260px]">

      <div class="absolute inset-0 opacity-20 bg-[url('https://www.transparenttextures.com/patterns/stardust.png')]"></div>

      <div class="absolute right-10 top-1/2 -translate-y-1/2 text-8xl planet">
        🌍
      </div>

      <div class="absolute left-0 top-0 w-full h-full" id="raceTrack">

        <div class="ship" id="playerShip" style="top: 40px; left: 20px;">
          🚀
          <div class="text-sm text-center mt-1" id="playerLabel"></div>
        </div>

        <div class="ship" id="bot1" style="top: 120px; left: 20px;">
          🛸
          <div class="text-sm text-center mt-1">Bot Alpha</div>
        </div>

        <div class="ship" id="bot2" style="top: 200px; left: 20px;">
          🚁
          <div class="text-sm text-center mt-1">Bot Omega</div>
        </div>

      </div>
    </div>
  </div>

  <!-- RESULT -->
  <div id="resultScreen" class="hidden glass rounded-3xl p-10 text-center max-w-2xl shadow-2xl">
    <h1 class="text-5xl font-bold mb-6">🏆 KẾT THÚC!</h1>

    <div id="winnerText" class="text-3xl font-bold text-yellow-300 mb-4"></div>

    <p class="text-2xl mb-6">
      Tàu của bạn đã đáp xuống Trái Đất thành công 🌍
    </p>

    <div class="text-8xl mb-8 animate-bounce">🚀</div>

    <button onclick="restartGame()"
      class="bg-green-500 hover:bg-green-600 transition px-8 py-4 rounded-2xl text-xl font-bold">
      Chơi Lại
    </button>
  </div>
</div>

<script>
  const quiz = [
    {
      question: "Internet là gì?",
      answers: ["Mạng toàn cầu", "Một game", "CPU", "Máy in"],
      correct: 0
    },
    {
      question: "HTML dùng để?",
      answers: ["Lập trình AI", "Tạo giao diện web", "Hack wifi", "Làm game 3D"],
      correct: 1
    },
    {
      question: "CSS có chức năng gì?",
      answers: ["Trang trí giao diện", "Lưu dữ liệu", "Tạo virus", "Tăng FPS"],
      correct: 0
    },
    {
      question: "JavaScript giúp gì cho web?",
      answers: ["Tạo tương tác", "Nấu ăn", "Cài win", "Làm CPU mạnh"],
      correct: 0
    },
    {
      question: "Ai sẽ thắng cuộc đua hôm nay? 😎",
      answers: ["Bạn", "Bạn", "Bạn", "Tất cả đáp án trên"],
      correct: 3
    }
  ];

  let currentQuestion = 0;
  let score = 0;
  let timer = 15;
  let countdown;
  let playerName = "";

  let playerDistance = 20;
  let bot1Distance = 20;
  let bot2Distance = 20;

  const startScreen = document.getElementById("startScreen");
  const gameScreen = document.getElementById("gameScreen");
  const resultScreen = document.getElementById("resultScreen");

  function startGame() {
    const input = document.getElementById("playerName");

    if (!input.value.trim()) {
      alert("Nhập tên đi 😭");
      return;
    }

    playerName = input.value;

    document.getElementById("playerLabel").textContent = playerName;

    startScreen.classList.add("hidden");
    gameScreen.classList.remove("hidden");

    currentQuestion = 0;
    score = 0;

    playerDistance = 20;
    bot1Distance = 20;
    bot2Distance = 20;

    updateShips();
    loadQuestion();
  }

  function loadQuestion() {
    clearInterval(countdown);

    timer = 15;
    document.getElementById("timer").textContent = timer;

    countdown = setInterval(() => {
      timer--;
      document.getElementById("timer").textContent = timer;

      if (timer <= 0) {
        clearInterval(countdown);
        simulateBots();
        nextQuestion();
      }
    }, 1000);

    const q = quiz[currentQuestion];

    document.getElementById("questionNumber").textContent =
      `Câu ${currentQuestion + 1}/${quiz.length}`;

    document.getElementById("scoreText").textContent =
      `Điểm: ${score}`;

    document.getElementById("questionText").textContent = q.question;

    const answersDiv = document.getElementById("answers");
    answersDiv.innerHTML = "";

    q.answers.forEach((answer, index) => {
      const button = document.createElement("button");

      button.className =
        "bg-white/10 hover:bg-blue-500 transition p-5 rounded-2xl text-lg font-bold";

      button.textContent = answer;

      button.onclick = () => checkAnswer(index);

      answersDiv.appendChild(button);
    });
  }

  function checkAnswer(index) {
    clearInterval(countdown);

    const correct = quiz[currentQuestion].correct;

    if (index === correct) {
      score += 10;
      playerDistance += 120;
      document.getElementById("correctSound").play();
    } else {
      playerDistance += 40;
      document.getElementById("wrongSound").play();
    }

    simulateBots();

    showRaceAnimation();
  }

  function showRaceAnimation() {
    const panel = document.getElementById("questionPanel");
    const race = document.getElementById("raceScene");

    panel.style.transform = "scale(0.75) translateY(-40px)";
    panel.style.opacity = "0";

    race.style.transform = "scale(1.08)";
    race.style.transition = "all 0.8s ease";

    document.getElementById("moveSound").play();

    updateShips();

    setTimeout(() => {
      race.style.transform = "scale(1)";

      panel.style.transform = "scale(1) translateY(0px)";
      panel.style.opacity = "1";

      nextQuestion();
    }, 2200);
  }

  function simulateBots() {
    bot1Distance += Math.floor(Math.random() * 100 + 50);
    bot2Distance += Math.floor(Math.random() * 100 + 50);

    updateShips();
  }

  function updateShips() {
    document.getElementById("playerShip").style.left = `${playerDistance}px`;
    document.getElementById("bot1").style.left = `${bot1Distance}px`;
    document.getElementById("bot2").style.left = `${bot2Distance}px`;
  }

  function nextQuestion() {
    currentQuestion++;

    if (currentQuestion >= quiz.length) {
      endGame();
    } else {
      loadQuestion();
    }
  }

  function endGame() {
    gameScreen.classList.add("hidden");
    resultScreen.classList.remove("hidden");

    const distances = [
      { name: playerName, dist: playerDistance },
      { name: "Bot Alpha", dist: bot1Distance },
      { name: "Bot Omega", dist: bot2Distance }
    ];

    distances.sort((a, b) => b.dist - a.dist);

    if (distances[0].name === playerName) {
      document.getElementById("winnerText").textContent =
        `${playerName} đã chiến thắng cuộc đua! 🚀`;
    } else {
      document.getElementById("winnerText").textContent =
        `${distances[0].name} đã về nhất 😭`;
    }
  }

  function restartGame() {
    resultScreen.classList.add("hidden");
    startScreen.classList.remove("hidden");
  }
</script>
</body>
</html>
